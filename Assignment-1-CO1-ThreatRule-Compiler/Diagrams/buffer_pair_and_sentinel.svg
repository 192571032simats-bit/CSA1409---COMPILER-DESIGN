<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="480.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="19">Input buffering: paired buffers and sentinels</text><rect x="40" y="100" width="250" height="90" rx="7" fill="#eaf1ff" stroke="#244b80" stroke-width="2"/><text x="165.0" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Buffer 1</text><text x="165.0" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">input characters ... sentinel</text><rect x="350" y="100" width="250" height="90" rx="7" fill="#eaf1ff" stroke="#244b80" stroke-width="2"/><text x="475.0" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Buffer 2</text><text x="475.0" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">input characters ... sentinel</text><rect x="670" y="100" width="250" height="90" rx="7" fill="#fff4df" stroke="#244b80" stroke-width="2"/><text x="795.0" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Refill buffer</text><text x="795.0" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">when a sentinel is reached</text><path d="M290,145 L350,145" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="138.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">scan forward</text><path d="M600,145 L670,145" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="635.0" y="138.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">sentinel</text><path d="M795,190 L160,230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="477.5" y="203.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">alternate buffers; preserve lexeme start</text><rect x="250" y="280" width="500" height="70" rx="7" fill="#eaf1ff" stroke="#244b80" stroke-width="2"/><text x="500.0" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">lexeme start pointer + forward pointer</text><text x="500.0" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">lookahead; retract at token boundary</text></svg>