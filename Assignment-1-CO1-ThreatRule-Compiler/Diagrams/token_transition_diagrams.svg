imiter</text><text x="380.0" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">IPv4 address</text><rect x="30" y="700" width="150" height="70" rx="7" fill="#f1f6ff" stroke="#244b80" stroke-width="2"/><text x="105.0" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Start</text><rect x="210" y="700" width="150" height="70" rx="7" fill="#f1f6ff" stroke="#244b80" stroke-width="2"/><text x="285.0" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Read octet 1</text><path d="M180,735 L210,735" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="195" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">digit</text><rect x="390" y="700" width="150" height="70" rx="7" fill="#f1f6ff" stroke="#244b80" stroke-width="2"/><text x="465.0" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Read octets 2 and 3</text><text x="465.0" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">with dots</text><path d="M360,735 L390,735" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">dot + digits</text><rect x="570" y="700" width="150" height="70" rx="7" fill="#f1f6ff" stroke="#244b80" stroke-width="2"/><text x="645.0" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Read octet 4;</text><text x="645.0" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">validate 0..255</text><rect x="574" y="704" width="142" height="62" rx="5" fill="none" stroke="#244b80" stroke-width="1.5"/><path d="M540,735 L570,735" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">dot + digits</text><text x="30" y="820" font-family="Arial, sans-serif" font-size="12">Double border = accepting state. Flex uses longest match; nonmatching lookahead is retracted before accepting a shorter operator/token.</text></svg>